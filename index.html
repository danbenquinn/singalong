<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Singalong</title>
  <!-- Fit the phone's width exactly; no pinch-zoom surprises on a music stand -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- "Add to Home Screen" on iPhone opens this full-screen, without Safari's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="stylesheet" href="style.css?v=1793214419">
</head>
<body>

  <!-- Top bar: song info and font-size buttons -->
  <header id="topbar">
    <button id="open-picker" title="Song picker">
      <span id="title">Loading…</span>
      <span id="artist"></span>
    </button>
    <div id="tools">
      <button id="font-minus" title="Smaller text">−</button>
      <button id="font-plus" title="Larger text">+</button>
    </div>
  </header>

  <!-- Controls: mode toggle and key on one row, speed on the next -->
  <div id="controls">
    <div id="mode">
      <button data-mode="manual">Manual</button>
      <button data-mode="voice">Voice</button>
    </div>
    <select id="key" title="Key (melody range)"></select>
  </div>
  <div id="speed-row">
    <span id="speed-label">Speed</span>
    <input type="range" id="speed" min="0" max="2" step="0.05" value="1">
    <span id="speed-value">1×</span>
  </div>
  <div id="voice-row" hidden>
    <span id="voice-dot"></span>
    <span id="voice-status">Starting…</span>
    <span id="voice-heard"></span>
  </div>

  <!-- The song scrolls inside this viewport; play button and drag bar sit in a column on its right edge -->
  <main id="viewport">
    <div id="song"></div>
    <div id="sidebar">
      <button id="play" title="Play / pause">▶</button>
      <div id="scrollbar"><div id="thumb"></div></div>
    </div>
  </main>

  <!-- Song picker: covers the screen when open -->
  <div id="picker" hidden>
    <div id="picker-top">
      <input type="search" id="search" placeholder="Search title or artist" autocomplete="off">
      <button id="close-picker" title="Back to song">✕</button>
    </div>
    <div id="filters"></div>
    <ul id="songlist"></ul>
  </div>

  <!-- Password gate: shown until the right password is entered once on this device -->
  <div id="gate" hidden>
    <div id="gate-box">
      <div id="gate-title">Singalong</div>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="gate-go">Open</button>
      <div id="gate-msg"></div>
    </div>
  </div>

  <script src="config.js?v=1793214419"></script>
  <script src="app.js?v=1793214419"></script>
</body>
</html>
