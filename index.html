<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Singalong</title>
  <!-- Fit the phone's width exactly; no pinch-zoom surprises on a music stand -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- "Add to Home Screen" on iPhone opens this full-screen, without Safari's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: song info and font-size buttons -->
  <header id="topbar">
    <div id="songinfo">
      <span id="title">Loading…</span>
      <span id="artist"></span>
    </div>
    <div id="tools">
      <button id="font-minus" title="Smaller text">−</button>
      <button id="font-plus" title="Larger text">+</button>
    </div>
  </header>

  <!-- Key / transpose row -->
  <div id="controls">
    <label for="key">Key</label>
    <select id="key"></select>
    <span id="range" title="Melody range in this key"></span>
  </div>

  <!-- The song scrolls inside this viewport -->
  <main id="viewport">
    <div id="song"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
