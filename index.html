<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Singalong</title>
  <!-- Fit the phone's width exactly; no pinch-zoom surprises on a music stand -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- "Add to Home Screen" on iPhone opens this full-screen, without Safari's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: song info and font-size buttons -->
  <header id="topbar">
    <div id="songinfo">
      <span id="title">Loading…</span>
      <span id="artist"></span>
    </div>
    <div id="tools">
      <button id="font-minus" title="Smaller text">−</button>
      <button id="font-plus" title="Larger text">+</button>
    </div>
  </header>

  <!-- Controls: mode toggle and key on one row, speed on the next -->
  <div id="controls">
    <div id="mode">
      <button data-mode="manual">Manual</button>
      <button data-mode="voice">Voice</button>
    </div>
    <select id="key" title="Key (melody range)"></select>
  </div>
  <div id="speed-row">
    <input type="range" id="speed" min="0" max="2" step="0.05" value="0">
    <span id="speed-value">stopped</span>
  </div>
  <div id="voice-note" hidden>Voice mode arrives in stage 5. Manual controls still work.</div>

  <!-- The song scrolls inside this viewport; the drag bar sits on its right edge -->
  <main id="viewport">
    <div id="song"></div>
    <div id="scrollbar"><div id="thumb"></div></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
